name: Update API reference

# Regenerates src/content/docs/api/<pkg> from each package's JSDoc and commits
# the result. The site build itself only consumes the committed markdown, so it
# never needs the package repos. Run this when a package's public API changes:
# manually, on a weekly schedule, or by a repository_dispatch from a package
# repo's own release workflow (event type: api-update).
#
# That last path needs a token: GITHUB_TOKEN cannot dispatch across repos. Each
# package's release workflow sends it only when a SUITE_DISPATCH_TOKEN secret is
# present, so until one is configured the schedule and the manual run are what
# keep this current.
on:
  workflow_dispatch:
  # Daily, not weekly. The repository_dispatch below is the precise trigger, but
  # it needs a cross-repo token that is not worth creating and rotating for this;
  # a nightly run costs a minute and caps how long a published API can sit stale
  # at a day instead of a week. The job commits nothing when nothing changed, so
  # most nights are a no-op.
  schedule:
    - cron: '0 6 * * *'
  repository_dispatch:
    types: [api-update]

permissions:
  contents: write
  actions: write # to start the deploy after committing; see the last step

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          path: suite
      # The packages must sit next to the site so TypeDoc can read ../<pkg>/src.
      - uses: actions/checkout@v4
        with: { repository: tangent-to/opt, path: opt }
      - uses: actions/checkout@v4
        with: { repository: tangent-to/proba, path: proba }
      - uses: actions/checkout@v4
        with: { repository: tangent-to/lina, path: lina }
      - uses: actions/checkout@v4
        with: { repository: tangent-to/grad, path: grad }
      - uses: actions/checkout@v4
        with: { repository: tangent-to/ode, path: ode }
      - uses: actions/checkout@v4
        with: { repository: tangent-to/ds, path: ds }
      - uses: actions/checkout@v4
        with: { repository: tangent-to/mc, path: mc }
      - uses: actions/checkout@v4
        with: { repository: tangent-to/sem, path: sem }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install site deps (TypeDoc)
        run: npm ci
        working-directory: suite
      - name: Regenerate the API reference
        run: npm run gen:api
        working-directory: suite
      - name: Commit if it changed
        id: commit
        working-directory: suite
        run: |
          git config user.name 'tangent-bot'
          git config user.email 'bot@tangent.to'
          git add src/content/docs/api
          if git diff --cached --quiet; then
            echo 'API reference already up to date.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'chore: regenerate API reference from package JSDoc'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # A push made with GITHUB_TOKEN does not trigger other workflows — GitHub
      # blocks that to prevent recursion. So committing a regenerated reference
      # never redeployed the site: the markdown landed on main and the live
      # pages stayed as they were until some unrelated human push happened to
      # rebuild. grad's API reference sat committed-but-404 for exactly that
      # reason. Start the deploy explicitly.
      - name: Deploy the rebuilt site
        if: steps.commit.outputs.changed == 'true'
        working-directory: suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
